server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Collect all Docker container logs via the Docker socket
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Use the container name as the job label
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container
      # Expose the Docker Compose service name if present
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: compose_service
      # Expose the Docker Compose project name if present
      - source_labels: [__meta_docker_container_label_com_docker_compose_project]
        target_label: compose_project
      # Drop containers with no name
      - source_labels: [container]
        regex: ""
        action: drop

  # Also collect host-level syslog
  - job_name: syslog
    static_configs:
      - targets:
          - localhost
        labels:
          job: syslog
          __path__: /var/log/syslog
