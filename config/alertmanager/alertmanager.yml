global:
  resolve_timeout: 5m
  # SMTP settings for email alerts — fill in or remove if not using email
  #smtp_smarthost: "${SMTP_HOST}:587"
  #smtp_from: "${SMTP_FROM}"
  #smtp_auth_username: "${SMTP_USER}"
  #smtp_auth_password: "${SMTP_PASSWORD}"
  #smtp_require_tls: true

route:
  group_by: ["alertname", "job"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h
  receiver: discord

  routes:
    # Critical alerts go to both Discord and email
    - match:
        severity: critical
      receiver: discord-and-email
      repeat_interval: 30m

receivers:
  - name: discord
    discord_configs:
      - webhook_url: "${DISCORD_WEBHOOK_URL}"
        title: '{{ if eq .Status "firing" }}🔥{{ else }}✅{{ end }} [{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}'
        message: |
          {{ range .Alerts }}
          **Summary:** {{ .Annotations.summary }}
          **Description:** {{ .Annotations.description }}
          **Severity:** {{ .Labels.severity }}
          {{ end }}

  - name: discord-and-email
    discord_configs:
      - webhook_url: "${DISCORD_WEBHOOK_URL}"
        title: '{{ if eq .Status "firing" }}🔥{{ else }}✅{{ end }} [{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}'
        message: |
          {{ range .Alerts }}
          **Summary:** {{ .Annotations.summary }}
          **Description:** {{ .Annotations.description }}
          **Severity:** {{ .Labels.severity }}
          {{ end }}
    email_configs:
      - to: "${ALERT_EMAIL_TO}"
        send_resolved: true

inhibit_rules:
  # Suppress warnings if a critical alert is already firing for the same instance
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ["alertname", "instance"]
